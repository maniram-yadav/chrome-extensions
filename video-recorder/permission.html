<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Microphone access – Area Video Recorder</title>
  <style>
    body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 90vh; background: #f3f4f6; color: #111827; }
    .box { background: #fff; padding: 28px 32px; border-radius: 12px; max-width: 460px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    #status { margin-top: 14px; font-weight: 600; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🎙️ Microphone access</h2>
    <p>Area Video Recorder needs your permission once to record your voice together with the page.</p>
    <button id="allow">Allow microphone</button>
    <div id="status"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
