<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Screen Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Screen Capture</h1>
    <button id="capture" class="primary">Capture area</button>
  </header>

  <label class="toggle">
    <input type="checkbox" id="showFab" />
    Show floating button on pages
  </label>
  <label class="toggle">
    <input type="checkbox" id="autoCopy" />
    Copy to clipboard after each capture
  </label>

  <p id="error" class="error" hidden></p>

  <main id="list"></main>
  <p id="empty" class="empty">
    No captures yet.<br />
    Click the floating button on any page (or press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>)
    and drag over the area you want.
  </p>

  <footer>
    <button id="clearAll" class="danger" disabled>Clear all</button>
    <button id="downloadAll" class="primary" disabled>Download all</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
