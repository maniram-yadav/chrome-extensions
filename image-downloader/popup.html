<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" class="logo">
    <div class="title">
      <h1>Image Downloader</h1>
      <p id="stateText">On</p>
    </div>
    <label class="switch" title="Turn the download buttons on or off">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <main id="effectPanel">
    <div class="section-head">
      <h2>Effect on download</h2>
      <button id="reset" class="link" type="button">Reset</button>
    </div>

    <div class="preview"><img id="previewImg" alt="Effect preview"></div>
    <p id="effectStatus" class="status"></p>

    <div class="presets" id="presets"></div>

    <div class="sliders" id="sliders"></div>

    <div class="row transforms">
      <span class="label">Rotate / flip</span>
      <div class="btns">
        <button type="button" id="rotL" title="Rotate left 90°">⟲</button>
        <button type="button" id="rotR" title="Rotate right 90°">⟳</button>
        <button type="button" id="flipH" class="toggle" title="Flip horizontally">⇋</button>
        <button type="button" id="flipV" class="toggle" title="Flip vertically">⇵</button>
        <span id="rotVal" class="value">0°</span>
      </div>
    </div>

    <p class="hint">Hover over a download button on the page to preview the effect on that image.</p>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
