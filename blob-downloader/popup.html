<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blob Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Blob Video Downloader</h1>
    <div class="actions">
      <button id="clear-all" title="Remove every video from the list">&#x1f5d1; Clear all</button>
      <button id="refresh" title="Scan the page again">&#x21bb; Refresh</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main id="content">
    <p class="empty">Scanning page&hellip;</p>
  </main>

  <footer>
    Click a video to download it (named by current date &amp; time). &times; removes it from the list.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
