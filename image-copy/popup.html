<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" class="logo">
    <div class="title">
      <h1>Image Copy</h1>
      <p id="stateText">On</p>
    </div>
    <label class="switch" title="Show or hide the buttons on pages">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" class="tab active" data-tab="list" id="tabList">Saved images <span id="count" class="count">0</span></button>
    <button type="button" role="tab" class="tab" data-tab="effect" id="tabEffect">Effect <span id="fxDot" class="dot" hidden></span></button>
  </nav>

  <!-- ---- Saved list ---- -->
  <section id="listPanel" class="panel">
    <div class="toolbar">
      <button type="button" id="fxChip" class="chip" title="Effect applied when you copy or add an image. Click to change.">Effect: None</button>
      <span id="totalSize" class="muted"></span>
      <button type="button" id="deleteAll" class="danger">Delete all</button>
    </div>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">＋</div>
      <p><strong>No saved images yet</strong></p>
      <p class="muted">Hover an image on any page and click the <b>＋</b> button to add it here.</p>
    </div>
  </section>

  <!-- ---- Effect editor ---- -->
  <section id="effectPanel" class="panel" hidden>
    <div class="section-head">
      <h2>Effect on copy &amp; add</h2>
      <button id="reset" class="link" type="button">Reset</button>
    </div>

    <div class="preview"><img id="previewImg" alt="Effect preview"></div>
    <p id="effectStatus" class="status"></p>

    <div class="presets" id="presets"></div>
    <div class="sliders" id="sliders"></div>

    <div class="row transforms">
      <span class="label">Rotate / flip</span>
      <div class="btns">
        <button type="button" id="rotL" title="Rotate left 90°">⟲</button>
        <button type="button" id="rotR" title="Rotate right 90°">⟳</button>
        <button type="button" id="flipH" class="toggle" title="Flip horizontally">⇋</button>
        <button type="button" id="flipV" class="toggle" title="Flip vertically">⇵</button>
        <span id="rotVal" class="value">0°</span>
      </div>
    </div>

    <p class="hint">Hover a button on the page to preview the effect on that image. Double-click a slider to reset it.</p>
  </section>

  <div id="toast" class="toast" role="status"></div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
